<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wordnear — Semantic Word Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090a0f;
      --card-bg: rgba(22, 27, 34, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-border-hover: rgba(255, 255, 255, 0.16);
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --text-faint: #484f58;
      --accent: #2ea043;
      --accent-glow: rgba(46, 160, 67, 0.35);
      --hot-color: #f85149;
      --warm-color: #e3b341;
      --cold-color: #388bfd;
      --input-bg: rgba(13, 17, 23, 0.85);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(56, 139, 253, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(46, 160, 67, 0.1) 0px, transparent 50%);
      min-height: 100vh;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 40px 16px;
    }

    .container {
      width: 100%;
      max-width: 540px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* Header */
    .header {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .logo-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #7ee787;
      margin-bottom: 4px;
    }

    .logo-badge svg {
      width: 14px;
      height: 14px;
    }

    .header h1 {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.8px;
      background: linear-gradient(180deg, #ffffff 30%, #a5b4fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header p {
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 400;
    }

    /* Input Card */
    .input-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 8px 8px 8px 18px;
      backdrop-filter: blur(16px);
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      transition: all 0.25s ease;
    }

    .input-box:focus-within {
      border-color: rgba(126, 231, 135, 0.5);
      box-shadow: 0 0 0 3px rgba(46, 160, 67, 0.2), 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    .input-box input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 16px;
      font-family: inherit;
      font-weight: 500;
    }

    .input-box input::placeholder {
      color: var(--text-faint);
    }

    .btn-submit {
      background: #238636;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 10px 20px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s ease;
    }

    .btn-submit:hover {
      background: #2ea043;
      transform: translateY(-1px);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    /* Controls & Status */
    .controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px;
      font-size: 13px;
    }

    .status-msg {
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 500;
    }

    .btn-ghost {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s ease;
    }

    .btn-ghost:hover {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      border-color: var(--card-border-hover);
    }

    /* Guess Results List */
    .guess-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .guess-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      backdrop-filter: blur(12px);
      transition: transform 0.2s ease;
      animation: slideDown 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .guess-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .guess-word {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.2px;
      text-transform: capitalize;
    }

    .guess-meta {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .score-badge {
      font-size: 13px;
      font-weight: 700;
    }

    .temp-pill {
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 9999px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    /* Progress bar */
    .progress-track {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 9999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: 9999px;
      transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Semantic Temperature Colors */
    .hot {
      color: var(--hot-color);
    }
    .hot-bg {
      background: var(--hot-color);
    }
    .hot-pill {
      background: rgba(248, 81, 73, 0.15);
      color: var(--hot-color);
    }

    .warm {
      color: var(--warm-color);
    }
    .warm-bg {
      background: var(--warm-color);
    }
    .warm-pill {
      background: rgba(227, 179, 65, 0.15);
      color: var(--warm-color);
    }

    .cold {
      color: var(--cold-color);
    }
    .cold-bg {
      background: var(--cold-color);
    }
    .cold-pill {
      background: rgba(56, 139, 253, 0.15);
      color: var(--cold-color);
    }

    /* Win Banner */
    .win-banner {
      background: linear-gradient(135deg, rgba(46, 160, 67, 0.25), rgba(56, 139, 253, 0.15));
      border: 1px solid rgba(126, 231, 135, 0.4);
      padding: 16px;
      border-radius: 14px;
      text-align: center;
      font-weight: 600;
      color: #7ee787;
      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="logo-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"></polygon>
        </svg>
        Wordnear
      </div>
      <h1>Find the Secret Word</h1>
      <p>Enter any word to test its conceptual distance in embedding space</p>
    </div>

    <form id="guessForm" onsubmit="event.preventDefault(); submitGuess();">
      <div class="input-box">
        <input 
          type="text" 
          id="wordInput" 
          placeholder="Type your guess..." 
          autocomplete="off" 
          autofocus
        />
        <button type="submit" class="btn-submit">Guess</button>
      </div>
    </form>

    <div class="controls">
      <div id="statusMsg" class="status-msg">Waiting for your first guess...</div>
      <button type="button" class="btn-ghost" onclick="startNewGame()">↻ New Word</button>
    </div>

    <div id="winContainer"></div>
    <div id="guessList" class="guess-list"></div>
  </div>

  <script>
    const guesses = [];

    function getTempClass(score) {
      if (score >= 65) return { name: 'hot', label: 'Very Hot' };
      if (score >= 35) return { name: 'warm', label: 'Warm' };
      return { name: 'cold', label: 'Cold' };
    }

    function renderGuesses() {
      const list = document.getElementById("guessList");
      list.innerHTML = "";

      // Sort descending by highest similarity
      const sorted = [...guesses].sort((a, b) => b.similarity - a.similarity);

      sorted.forEach((item) => {
        const temp = getTempClass(item.similarity);
        const card = document.createElement("div");
        card.className = "guess-card";
        card.innerHTML = `
          <div class="guess-row">
            <span class="guess-word">${item.word}</span>
            <div class="guess-meta">
              <span class="temp-pill ${temp.name}-pill">${temp.label}</span>
              <span class="score-badge ${temp.name}">${item.similarity}%</span>
            </div>
          </div>
          <div class="progress-track">
            <div class="progress-fill ${temp.name}-bg" style="width: ${item.similarity}%;"></div>
          </div>
        `;
        list.appendChild(card);
      });
    }

    async function submitGuess() {
      const input = document.getElementById("wordInput");
      const statusMsg = document.getElementById("statusMsg");
      const word = input.value.trim().toLowerCase();

      if (!word) return;

      statusMsg.innerText = "Measuring semantic proximity...";

      try {
        const res = await fetch(`http://${window.location.hostname}:8000/guess`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ word: word })
        });

        if (!res.ok) {
          const err = await res.json();
          statusMsg.innerText = err.detail || "Error evaluating guess.";
          return;
        }

        const data = await res.json();

        // Avoid duplicate records
        if (!guesses.some(g => g.word === data.word)) {
          guesses.push(data);
        }

        renderGuesses();
        input.value = "";
        input.focus();

        if (data.is_correct) {
          statusMsg.innerText = "Target found!";
          document.getElementById("winContainer").innerHTML = `
            <div class="win-banner">
              🎉 Extraordinary! You found the secret word: <strong>${data.word}</strong>!
            </div>
          `;
        } else {
          statusMsg.innerText = `Evaluated "${data.word}" (${data.similarity}%)`;
        }
      } catch (err) {
        statusMsg.innerText = "Cannot reach backend. Verify port 8000 is open.";
      }
    }

    async function startNewGame() {
      const statusMsg = document.getElementById("statusMsg");
      statusMsg.innerText = "Selecting a new secret word...";

      try {
        const res = await fetch(`http://${window.location.hostname}:8000/new-game`, {
          method: "POST"
        });

        if (res.ok) {
          guesses.length = 0;
          document.getElementById("winContainer").innerHTML = "";
          renderGuesses();
          document.getElementById("wordInput").value = "";
          statusMsg.innerText = "New target word generated. Begin guessing!";
        } else {
          statusMsg.innerText = "Failed to generate new game.";
        }
      } catch (err) {
        statusMsg.innerText = "Cannot connect to server.";
      }
    }
  </script>
</body>
</html>
